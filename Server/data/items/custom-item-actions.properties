# Matrix3 custom item actions
#
# Canonical data authority: Server/data/items/custom-item-actions.properties
# Both the server and client read this same file at runtime.
#
# Format:
# item.<itemId>.handler=<stable handler type>
# item.<itemId>.<context>.<option>=<action>|<menu label>
#
# Contexts currently supported: inventory, equipment, bank, bank_inventory.
# Option numbers are intentionally 1-based so a future editor can expose
# "Option 1", "Option 2", etc. without leaking packet constants.
#
# Inventory options 1-5 map to normal item option packets.
# Equipment options 1-4 map to the custom equipped-item options that follow Remove.
# Bank options use the bank item-container's native option numbers.
# Bank_inventory options use the bank inventory pane's native 1-10 interface
# option slots. The client adds only configured slots that are currently absent;
# stock labels/actions are never silently renamed or repurposed.

item.21445.handler=BACKPACK
item.21445.inventory.4=OPEN|Open
item.21445.equipment.1=OPEN|Open
item.21445.bank.7=OPEN|Open
item.21445.bank_inventory.6=OPEN|Open
item.21445.bank_inventory.10=EMPTY_TO_BANK|Empty to bank
