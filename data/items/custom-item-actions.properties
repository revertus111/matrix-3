# Matrix3 custom item actions
#
# Format:
# item.<itemId>.handler=<stable handler type>
# item.<itemId>.<context>.<option>=<action>|<menu label>
#
# Contexts currently supported by the server: inventory, equipment, bank.
# Option numbers are intentionally 1-based so a future editor can expose
# "Option 1", "Option 2", etc. without leaking packet constants.
#
# Inventory options 1-5 map to normal item option packets.
# Equipment options 1-4 map to the custom equipped-item options that follow Remove.
# Bank options use the bank component's native option numbers. Bank option 7 is
# the existing wearable-item action and can safely be specialized per configured
# item. Additional bank-only labels still need the narrow client menu hook before
# they should be enabled; do not secretly repurpose a stock label.

item.21445.handler=BACKPACK
item.21445.inventory.4=OPEN|Open
item.21445.equipment.1=OPEN|Open
item.21445.bank.7=OPEN|Open

# Server behavior for this action is implemented, but leave it disabled until the
# client bank-menu text hook can display the configured label for this item only.
# item.21445.bank.6=EMPTY_TO_BANK|Empty to bank
